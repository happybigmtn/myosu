# cargo-audit configuration for the SEC-001 dependency-audit gate.
#
# This config is read automatically by `cargo audit` when run from the
# repository root. It exists to keep the SEC-001 gate reproducible across
# hosts and to encode the one place where the gate's strictness is
# intentionally narrower than the cargo-audit default.
#
# The gate itself is still invoked with `-D warnings` from
# `.github/workflows/ci.yml` and `tests/e2e/sec001_allowlist_consistency.sh`,
# matching plan 008 / spec `110426-security-posture.md` acceptance
# criterion #2. Cargo-audit treats `-D warnings` as "deny on every kind
# of warning" which in 0.22.1 includes the separate `[yanked]` warning
# for crates that have been pulled from crates.io. We disable that
# warning class below because:
#
#   * The only currently-yanked crate in this workspace is `core2 0.4.0`,
#     reached transitively through `multihash` -> `libp2p` ->
#     `polkadot-sdk` 2506.0.0. SEC-001 explicitly forbids rebasing the
#     polkadot-sdk fork (`Scope boundary: Do NOT rebase the polkadot-sdk
#     fork.`), and the only Myosu-owned code path that touches core2 is
#     none -- there is no `core2` direct dependency in any Myosu crate.
#   * RUSTSEC-2026-0105 already documents the core2 unmaintained/yanked
#     situation as an advisory and is itself in the SEC-001 allowlist
#     under the `inherited-misc` category. Double-counting it as both an
#     advisory and a yanked warning would not change the security
#     posture, only cause the gate to fail spuriously.
#   * Real security issues (`unsound`, `unmaintained` with a working
#     remediation, and RUSTSEC CVEs) are still denied by `-D warnings`
#     and continue to fail the gate.
#
# Any future change to this file must come with an updated row in
# SECURITY.md "SEC-001 Advisory Triage Table" and a passing
# `tests/e2e/sec001_allowlist_consistency.sh` run.

[advisories]
ignore = [
  "RUSTSEC-2020-0168",
  "RUSTSEC-2021-0127",
  "RUSTSEC-2022-0061",
  "RUSTSEC-2023-0091",
  "RUSTSEC-2024-0370",
  "RUSTSEC-2024-0384",
  "RUSTSEC-2024-0388",
  "RUSTSEC-2024-0436",
  "RUSTSEC-2024-0438",
  "RUSTSEC-2024-0442",
  "RUSTSEC-2025-0009",
  "RUSTSEC-2025-0010",
  "RUSTSEC-2025-0055",
  "RUSTSEC-2025-0057",
  "RUSTSEC-2025-0118",
  "RUSTSEC-2025-0141",
  "RUSTSEC-2025-0161",
  "RUSTSEC-2026-0002",
  "RUSTSEC-2026-0020",
  "RUSTSEC-2026-0021",
  "RUSTSEC-2026-0085",
  "RUSTSEC-2026-0086",
  "RUSTSEC-2026-0087",
  "RUSTSEC-2026-0088",
  "RUSTSEC-2026-0089",
  "RUSTSEC-2026-0091",
  "RUSTSEC-2026-0092",
  "RUSTSEC-2026-0093",
  "RUSTSEC-2026-0094",
  "RUSTSEC-2026-0095",
  "RUSTSEC-2026-0096",
  "RUSTSEC-2026-0097",
  "RUSTSEC-2026-0098",
  "RUSTSEC-2026-0099",
  "RUSTSEC-2026-0104",
  "RUSTSEC-2026-0105",
  "RUSTSEC-2026-0118",
  "RUSTSEC-2026-0119",
  "RUSTSEC-2026-0173",
]

# The SEC-001 allowlist is the source of truth. The list above is a
# mirror of what is enforced by `tests/e2e/sec001_allowlist_consistency.sh`
# and the inline `--ignore` lines in `.github/workflows/ci.yml`; if you
# add or remove an advisory, update all three places in the same commit.
informational_warnings = []
severity_threshold = "low"

[database]
# The CI job fetches the latest advisory DB on the runner. The local
# e2e consistency test runs with `--no-fetch` so it does not require
# network access; this matches the workflow's `taiki-e/install-action`
# step which always pulls a fresh DB.
fetch = true
stale = false

[output]
# `-D warnings` is still passed on the command line, so this is
# redundant; we list it explicitly to make the gate's intent obvious
# to anyone reading the file.
deny = ["warnings"]
format = "terminal"
quiet = false
show_tree = true

[target]
# Operator hosts run on Linux x86_64 per the operator guide; the
# existing `inherited-chain` allowlist already documents that
# macOS-only and Windows-only advisories (e.g. RUSTSEC-2020-0168
# `mach`, RUSTSEC-2024-0438 wasmtime Windows device names) cannot
# be exercised in production. We do not narrow the target here.
arch = []
os = []

[yanked]
# See the file header for the rationale. Only `core2 0.4.0` is currently
# flagged, and it is already covered by RUSTSEC-2026-0105 in the
# advisory allowlist. Disabling the standalone yanked warning prevents
# the gate from failing on a non-security issue.
enabled = false
update_index = true
