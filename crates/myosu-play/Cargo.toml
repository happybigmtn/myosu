[package]
name = "myosu-play"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Executable TUI and pipe-mode entrypoint for Myosu play"

[[bin]]
name = "myosu-play"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["derive"] }
myosu-chain-client.workspace = true
myosu-games = { path = "../myosu-games" }
myosu-games-kuhn = { path = "../myosu-games-kuhn" }
myosu-games-liars-dice = { path = "../myosu-games-liars-dice" }
myosu-games-poker = { path = "../myosu-games-poker" }
myosu-games-portfolio.workspace = true
myosu-tui = { path = "../myosu-tui" }
ratatui = { workspace = true }
sha2.workspace = true
subtensor-runtime-common.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
rbp-gameplay = { git = "https://github.com/happybigmtn/robopoker", rev = "04716310143094ab41ec7172e6cea5a2a66744ef" }
rbp-nlhe = { git = "https://github.com/happybigmtn/robopoker", rev = "04716310143094ab41ec7172e6cea5a2a66744ef", features = ["serde"] }
