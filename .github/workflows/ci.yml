name: CI

on:
  pull_request:
    branches:
      - trunk
      - main
  push:
    branches:
      - trunk
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repo-shape:
    name: Stage-0 Repo Shape
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Verify current stage-0 workspace and doctrine surface
        run: bash .github/scripts/check_stage0_repo_shape.sh

  robopoker-fork-coherence:
    name: Robopoker Fork Coherence
    runs-on: ubuntu-latest
    needs: repo-shape
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Report robopoker fork divergence
        run: bash .github/scripts/check_robopoker_fork_status.sh

  python-research-qa:
    name: Python Research QA
    runs-on: ubuntu-latest
    needs: repo-shape

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python research QA dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest ruff

      - name: Ruff check
        run: ruff check main.py methods.py runner.py metrics.py data.py

      - name: Python test suite
        run: python -m pytest tests/test_metrics.py tests/test_data.py -v

  active-crates:
    name: Active Crates
    runs-on: ubuntu-latest
    needs: repo-shape
    env:
      SKIP_WASM_BUILD: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Cargo check (all active crates)
        run: |
          cargo check \
            -p myosu-games \
            -p myosu-games-kuhn \
            -p myosu-games-poker \
            -p myosu-games-liars-dice \
            -p myosu-games-portfolio \
            -p myosu-games-canonical \
            -p myosu-tui \
            -p myosu-play \
            -p myosu-chain-client \
            -p myosu-miner \
            -p myosu-validator

      - name: Focused property, shell-state, and smoke proofs
        run: |
          cargo test -p myosu-games --quiet serialization_roundtrip
          cargo test -p myosu-games-kuhn --quiet
          cargo test -p myosu-games-portfolio --quiet core
          cargo test -p myosu-games-canonical --quiet playtrace
          cargo test -p myosu-tui shell_state
          cargo test -p myosu-play smoke_report_proves_preflop_to_flop_progression --quiet
          cargo run -p myosu-play --quiet -- --smoke-test
          cargo run -p myosu-play --quiet -- --game kuhn --smoke-test

      - name: Canonical manifest and play harness
        run: |
          manifest="$(cargo run --quiet -p myosu-games-canonical --example canonical_manifest)"
          line_count="$(grep -c '^CANONICAL_GAME ' <<<"$manifest")"
          snapshot_count="$(grep -c 'snapshot=ok' <<<"$manifest")"
          if [[ "$line_count" -ne 10 || "$snapshot_count" -ne 10 ]]; then
            echo "canonical manifest expected 10 games and 10 snapshot=ok fields"
            printf '%s\n' "$manifest"
            exit 1
          fi
          bash tests/e2e/canonical_ten_play_harness.sh
          bash tests/e2e/research_play_harness.sh

      - name: Research game corpus harness
        run: bash tests/e2e/research_games_harness.sh

      - name: Research game strength harness
        run: bash tests/e2e/research_strength_harness.sh

      - name: Promotion manifest harness
        run: bash tests/e2e/promotion_manifest.sh

      - name: Promotion manifest quality gate (PROMOTE-001-2)
        run: bash tests/e2e/promotion_manifest_quality_gate.sh

      - name: INV-004 solver-gameplay dependency boundary
        run: |
          play_tree="$(cargo tree -p myosu-play --edges normal)"
          if grep -q 'myosu-miner' <<<"$play_tree"; then
            echo "INV-004 violated: myosu-play depends on myosu-miner"
            printf '%s\n' "$play_tree"
            exit 1
          fi
          miner_tree="$(cargo tree -p myosu-miner --edges normal)"
          if grep -q 'myosu-play' <<<"$miner_tree"; then
            echo "INV-004 violated: myosu-miner depends on myosu-play"
            printf '%s\n' "$miner_tree"
            exit 1
          fi

      - name: Full active-crate test suite
        run: |
          cargo test --quiet \
            -p myosu-games \
            -p myosu-games-kuhn \
            -p myosu-games-poker \
            -p myosu-games-liars-dice \
            -p myosu-games-portfolio \
            -p myosu-games-canonical \
            -p myosu-tui \
            -p myosu-play \
            -p myosu-chain-client \
            -p myosu-miner \
            -p myosu-validator

      - name: Clippy (all active crates)
        run: |
          cargo clippy \
            -p myosu-games \
            -p myosu-games-kuhn \
            -p myosu-games-poker \
            -p myosu-games-liars-dice \
            -p myosu-games-portfolio \
            -p myosu-games-canonical \
            -p myosu-tui \
            -p myosu-play \
            -p myosu-chain-client \
            -p myosu-miner \
            -p myosu-validator \
            -- -D warnings

      - name: Clippy (bootstrap game examples)
        run: |
          cargo clippy \
            -p myosu-games-kuhn \
            -p myosu-games-poker \
            -p myosu-games-liars-dice \
            -p myosu-games-portfolio \
            -p myosu-games-canonical \
            --examples \
            -- -D warnings

      - name: Rustfmt (all active crates)
        run: |
          git ls-files \
            'crates/myosu-tui/**/*.rs' \
            'crates/myosu-games/**/*.rs' \
            'crates/myosu-games-kuhn/**/*.rs' \
            'crates/myosu-games-poker/**/*.rs' \
            'crates/myosu-games-liars-dice/**/*.rs' \
            'crates/myosu-games-portfolio/**/*.rs' \
            'crates/myosu-games-canonical/**/*.rs' \
            'crates/myosu-play/**/*.rs' \
            'crates/myosu-chain-client/**/*.rs' \
            'crates/myosu-miner/**/*.rs' \
            'crates/myosu-validator/**/*.rs' \
            | xargs rustfmt --edition 2024 --check

  chain-core:
    name: Chain Core
    runs-on: ubuntu-latest
    needs: repo-shape
    env:
      SKIP_WASM_BUILD: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: chain-stage0

      - name: Runtime check
        run: cargo check -p myosu-chain-runtime --features fast-runtime

      - name: Pallet check
        run: cargo check -p pallet-game-solver

      - name: Node check
        run: cargo check -p myosu-chain --features fast-runtime

      - name: Pallet stage-0 tests
        run: cargo test -p pallet-game-solver --quiet -- stage_0

      - name: Runtime tests
        run: cargo test -p myosu-chain-runtime --quiet

      - name: Refresh runtime wasm cache for migration smoke test
        run: env -u SKIP_WASM_BUILD cargo build -p myosu-chain-runtime --features fast-runtime --quiet

      - name: Runtime migration smoke test
        run: cargo test -p myosu-chain --features fast-runtime,try-runtime --quiet devnet_runtime_upgrade_smoke_test_passes_on_fresh_genesis

      - name: Testnet build-spec P0 proof
        run: cargo test -p myosu-chain --features fast-runtime --test testnet_build_spec --quiet

  integration-e2e:
    name: E2E Integration
    runs-on: ubuntu-latest
    needs: chain-core
    timeout-minutes: 15
    env:
      SKIP_WASM_BUILD: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: wasm32v1-none

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: chain-stage0

      - name: Local loop integration proof
        run: bash tests/e2e/local_loop.sh

      - name: Two-node sync proof
        run: bash tests/e2e/two_node_sync.sh

      - name: Four-authority finality proof
        run: bash tests/e2e/four_node_finality.sh

      - name: Consensus restart resilience proof
        run: bash tests/e2e/consensus_resilience.sh

      - name: Cross-node emission agreement proof
        run: bash tests/e2e/cross_node_emission.sh

      - name: Cross-validator determinism proof
        run: bash tests/e2e/validator_determinism.sh

      - name: Emission accounting proof
        run: bash tests/e2e/emission_flow.sh

  doctrine:
    name: Doctrine Integrity
    runs-on: ubuntu-latest
    needs: repo-shape

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Verify canonical spec integrity
        run: bash .github/scripts/check_doctrine_integrity.sh

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    needs: repo-shape

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@2e5e45e985ec9321fdd2b05aa8de0872b125c29f # cargo-audit

      - name: Cargo audit
        run: |
          # SEC-001 (security-posture spec, plan 008): cargo-audit allowlist.
          #
          # Every entry below maps 1:1 to the classification table in
          # SECURITY.md "SEC-001 Advisory Triage Table" and is enforced by
          # `tests/e2e/sec001_allowlist_consistency.sh`. The categories are:
          #
          #   direct-owned:    bincode 1.3.3 used in game-crate wire and
          #                    checkpoint serialization. Decision deferred to
          #                    SEC-002; existing 1 MiB decode budget mitigates
          #                    the documented unfixed issue.
          #   inherited-chain: advisories from the opentensor polkadot-sdk
          #                    fork reachable only through the chain runtime
          #                    path (myosu-chain). No direct Myosu game or
          #                    operator code reaches the affected component.
          #                    The fork is pinned to a known rev and not
          #                    rebased here.
          #   inherited-wasm:  wasmtime 8.0.1 advisories in the chain
          #                    runtime's prepare/pvf path. Live mainnet
          #                    operations are blocked; only the dev/local
          #                    loop exercises this code.
          #   inherited-misc:  one-off libsecp256k1 / libp2p rand / yanked
          #                    core2 / rustls-webpki / hickory-proto surface
          #                    in the chain runtime; no direct Myosu game or
          #                    operator code path reaches them.
          #
          # The deny policy stays `-D warnings` (acceptance criterion #2
          # from plan 008). Adding a `--ignore` line without a category
          # comment breaks the consistency test.
          cargo audit \
            -D warnings \
            # --- direct-owned (game crate bincode 1.x; SEC-002 accept per ADR 012) --- \
            --ignore RUSTSEC-2025-0141 \
            # --- inherited-chain (polkadot-sdk fork) --- \
            --ignore RUSTSEC-2025-0009 \
            --ignore RUSTSEC-2025-0055 \
            --ignore RUSTSEC-2024-0388 \
            --ignore RUSTSEC-2025-0057 \
            --ignore RUSTSEC-2024-0384 \
            --ignore RUSTSEC-2020-0168 \
            --ignore RUSTSEC-2022-0061 \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2024-0370 \
            --ignore RUSTSEC-2025-0010 \
            --ignore RUSTSEC-2021-0127 \
            --ignore RUSTSEC-2026-0002 \
            # --- inherited-wasm (chain runtime wasmtime 8.0.1 PVF path) --- \
            --ignore RUSTSEC-2023-0091 \
            --ignore RUSTSEC-2024-0438 \
            --ignore RUSTSEC-2025-0118 \
            --ignore RUSTSEC-2026-0020 \
            --ignore RUSTSEC-2026-0021 \
            --ignore RUSTSEC-2024-0442 \
            --ignore RUSTSEC-2026-0085 \
            --ignore RUSTSEC-2026-0086 \
            --ignore RUSTSEC-2026-0087 \
            --ignore RUSTSEC-2026-0088 \
            --ignore RUSTSEC-2026-0089 \
            --ignore RUSTSEC-2026-0091 \
            --ignore RUSTSEC-2026-0092 \
            --ignore RUSTSEC-2026-0093 \
            --ignore RUSTSEC-2026-0094 \
            --ignore RUSTSEC-2026-0095 \
            --ignore RUSTSEC-2026-0096 \
            # --- inherited-misc (libp2p / rand / secp / webpki / hickory) --- \
            --ignore RUSTSEC-2025-0161 \
            --ignore RUSTSEC-2026-0097 \
            --ignore RUSTSEC-2026-0098 \
            --ignore RUSTSEC-2026-0099 \
            --ignore RUSTSEC-2026-0104 \
            --ignore RUSTSEC-2026-0105 \
            --ignore RUSTSEC-2026-0118 \
            --ignore RUSTSEC-2026-0119

      - name: Verify SEC-001 allowlist consistency
        run: bash tests/e2e/sec001_allowlist_consistency.sh

      - name: Verify SEC-001 allowlist is not stale
        # Defense-in-depth companion to the consistency test: confirms
        # every entry in the synced allowlist is still suppressing a
        # real advisory that the live `cargo audit -D warnings` gate
        # would otherwise deny. Detects the failure mode where the
        # lockfile has been bumped past a CVE but the corresponding
        # `--ignore` line was left behind.
        run: bash tests/e2e/sec001_allowlist_staleness_probe.sh

      - name: Verify F-001 Cribbage benchmark dossier
        env:
          SKIP_WASM_BUILD: "1"
        run: bash tests/e2e/cribbage_benchmark_dossier.sh

      - name: Verify F-008 Hearts benchmark dossier
        env:
          SKIP_WASM_BUILD: "1"
        run: bash tests/e2e/hearts_benchmark_dossier.sh

      - name: Verify F-009 Gin Rummy benchmark dossier
        env:
          SKIP_WASM_BUILD: "1"
        run: bash tests/e2e/gin_rummy_benchmark_dossier.sh

      - name: Verify F-010 Spades benchmark dossier
        env:
          SKIP_WASM_BUILD: "1"
        run: bash tests/e2e/spades_benchmark_dossier.sh

  developer-quickstart:
    name: Developer Quickstart
    runs-on: ubuntu-latest
    needs: repo-shape
    env:
      SKIP_WASM_BUILD: "1"

    steps:
      - name: Check out repository
        # CI-SEC-001: this line was the lone zizmor `unpinned-uses` HIGH
        # finding; the previous SHA `de0fac2...5f5f5447ce83dd` (a single
        # nibble typo: 5xxx -> 4fxx) returned HTTP 404 on github.com so
        # the action reference could not be resolved. The corrected SHA
        # is the real actions/checkout v6 release commit
        # `de0fac2e4500dabe0009e67214ff5f5447ce83dd` and matches the
        # other 11 references in this file.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Verify DX-001 developer quickstart gate
        run: bash tests/e2e/developer_quickstart.sh

  plan-quality:
    name: Plan Quality
    runs-on: ubuntu-latest
    needs: repo-shape

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Verify genesis plans expose milestones and proof commands
        run: bash .github/scripts/check_plan_quality.sh

  operator-network:
    name: Operator Network
    runs-on: ubuntu-latest
    needs: repo-shape
    env:
      SKIP_WASM_BUILD: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Verify operator bundle and named-network packaging
        run: bash .github/scripts/check_operator_network_bootstrap.sh

      - name: Fresh-machine operator proof
        run: bash .github/scripts/check_operator_network_fresh_machine.sh

  chain-clippy:
    name: Chain Clippy
    runs-on: ubuntu-latest
    needs: repo-shape
    env:
      SKIP_WASM_BUILD: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Runtime clippy
        run: cargo clippy -p myosu-chain-runtime --features fast-runtime -- -D warnings

      - name: Pallet clippy
        run: cargo clippy -p pallet-game-solver -- -D warnings

      - name: Node clippy
        run: cargo clippy -p myosu-chain --features fast-runtime -- -D warnings

  zizmor-policy:
    name: Zizmor Policy
    runs-on: ubuntu-latest
    needs: repo-shape

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install zizmor
        # Pinned to the major release tag so a future zizmor release
        # cannot silently change the audit set; the harness below
        # asserts the live findings match the policy file. The tag
        # SHA is recorded in the `zizmor-policy` job's lockfile in
        # `.github/scripts/zizmor-version.txt` for review.
        run: cargo install --locked zizmor --version '^1.25' --root /usr/local

      - name: Verify CI-SEC-001 zizmor policy
        # CI-SEC-001 proof harness: asserts (1) the policy file
        # exists with one `# reason:` justification per ignore
        # rule, (2) the phantom-SHA bug on actions/checkout line
        # 458 is fixed, (3) `zizmor --persona=auditor` exits 0
        # with 0 findings, (4) the same invocation with
        # `--no-config` emits exactly 7 informational findings
        # (proving the policy is the silencer, not a stale-cache
        # accident), and (5) the CI-SEC-001 row is [x] in the
        # plan with the ADR cross-reference. See ADR-013.
        run: bash tests/e2e/zizmor_policy.sh

  quality-benchmark:
    name: Liar's Dice Quality Benchmark (F-003)
    runs-on: ubuntu-latest
    needs: repo-shape
    env:
      SKIP_WASM_BUILD: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # Pinned via the same toolchain action the rest of the
        # workspace uses so the rust-cache key stays coherent
        # (see `.github/zizmor.yml` `dtolnay/rust-toolchain`
        # rule with the per-line `# reason:` justification).
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true

      - name: Verify F-003 Liar's Dice quality benchmark
        # F-003 / F-007 proof harness: asserts (1) the
        # `quality_benchmark` example produces a
        # `QUALITY_BENCHMARK_*` report from a fresh-start
        # ladder, (2) the report carries the expected
        # configuration (game, surface, solver_trees,
        # threshold, iteration ladder), (3) the report contains
        # exactly one `QUALITY_BENCHMARK_POINT` line per
        # requested iteration count with finite values, (4) the
        # report recommends `512` minimum iterations at
        # exploitability `<= 0.700000` (the operator-guide
        # number), (5) the validator's
        # `quality_benchmark_liars_dice_exploitability_converges`
        # unit test passes against the same threshold, and
        # (6) the public `LIARS_DICE_SOLVER_TREES` constant is
        # `1024` (matching the example output). The harness
        # runs the example end-to-end with the documented
        # ladder `[0, 128, 256, 512]` so a solver-constant
        # change that pushes 512-iteration exploitability
        # above `0.70` will fail this gate and force the
        # operator-guide update.
        run: bash tests/e2e/quality_benchmark_liars_dice.sh

  miner-convergence-doc:
    name: Miner convergence doc-reg drift guard (F-003)
    runs-on: ubuntu-latest
    needs: repo-shape
    env:
      SKIP_WASM_BUILD: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # Pinned via the same toolchain action the rest of the
        # workspace uses so the rust-cache key stays coherent
        # (see `.github/zizmor.yml` `dtolnay/rust-toolchain`
        # rule with the per-line `# reason:` justification).
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true

      - name: Verify F-003 miner convergence doc-reg drift guard
        # F-003 doc-reg drift guard: asserts (1) the new
        # `docs/operator-guide/miner-convergence.md` exists
        # and is labeled with F-003, (2) it publishes the
        # `recommended_minimum_iterations=512` Liar's Dice
        # recommendation at the `0.70` exploitability
        # threshold and points at
        # `tests/e2e/quality_benchmark_liars_dice.sh` as the
        # source of truth, (3) it records `nlhe-heads-up` as
        # blocked with the `isomorphism not found` /
        # `postflop_complete=false` rationale, (4) it records
        # `kuhn_poker` as closed-form / 0 iterations, (5)
        # `docs/operator-guide/quickstart.md` still links to
        # the new doc, and (6) the live `quality_benchmark`
        # example's `QUALITY_BENCHMARK_RECOMMENDATION` line
        # still emits `recommended_minimum_iterations=512` at
        # `threshold=0.700000` and the live
        # `LIARS_DICE_SOLVER_TREES` constant is still 1024 (so
        # the doc and the live benchmark cannot drift apart
        # silently). A drift in any of the above forces the
        # operator-facing per-game table to be updated in
        # lockstep with the live benchmark, the live unit
        # test, and the live solver constant.
        run: bash tests/e2e/miner_convergence_doc_keeps_truthful_thresholds.sh
